<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="jsminip2.css">
</head>

<body>
    <h1>Simon Says Game</h1>
    <h2>Press any key to start the game</h2>
    <h3>High score: 0</h3>
    <div class="btn-container" aria-label="Simon game buttons">
        <div class="line1">
            <button class="btn red" type="button" id="red" aria-label="Red">1</button>
            <button class="btn yellow" type="button" id="yellow" aria-label="Yellow">2</button>
        </div>
        <div class="line2">
            <button class="btn green" type="button" id="green" aria-label="Green">3</button>
            <button class="btn purple" type="button" id="purple" aria-label="Purple">4</button>
        </div>
    </div>
    <script src="jsminip2.js"></script>
</body>

</html>
